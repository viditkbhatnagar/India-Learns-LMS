<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · India Learns</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #fbf5e8;
        color: #0f1a2e;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 12px 40px rgba(15, 26, 46, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        background: #1a3a8f;
        color: #f58220;
        font-weight: 800;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #1a3a8f;
      }
      p {
        margin: 0.5rem 0;
        font-size: 0.95rem;
        color: #6b7280;
      }
      button {
        margin-top: 1.25rem;
        background: #f58220;
        color: #1a3a8f;
        border: none;
        font-weight: 600;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.95rem;
      }
      button:hover {
        background: #d96f1c;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge" aria-hidden="true">IL</div>
      <h1>You're offline</h1>
      <p>India Learns can't reach the network right now.</p>
      <p>Previously-loaded pages still work. Try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
