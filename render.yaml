# India Learns — Render Blueprint (single-service topology)
#
# One web service (Node) that builds both the API and the React app in the
# same repo and serves both from the same origin. Routes starting with /v1 or
# /health* hit the Express API; everything else is served from web/dist via
# express.static with an SPA fallback to index.html. This means:
#   - One URL for everything (frontend + API)
#   - No CORS, no cross-site cookie plumbing
#   - Auth cookies are same-origin → work everywhere
#
# Plus five cron jobs that hit HMAC-signed /v1/jobs endpoints on the web
# service. Schedules are UTC.
#
# Region: singapore (closest to ap-south-1 / Mumbai for MongoDB Atlas).
#
# After importing this blueprint:
#   1. Fill the secret group `il-app-secrets` — see DEPLOY.md.
#   2. First deploy will fail health check until MONGODB_URI is set.
#   3. Run `npm run seed:superadmin` from your laptop (or the Render Shell on
#      paid plans) to create the first super-admin.

services:
  # -------- Single web service (API + React SPA from same Node process) ----
  - type: web
    name: il-app
    runtime: node
    plan: standard
    region: singapore
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node api/dist/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Same-origin: API and SPA share the Render URL. WEB_ORIGIN is used for
      # CORS, but same-origin requests never hit CORS anyway — this value is a
      # harmless placeholder and gets overridden on the Render dashboard with
      # the actual Render-assigned URL once the service is created.
      - key: WEB_ORIGIN
        value: https://il-app.onrender.com
      - key: API_ORIGIN
        value: https://il-app.onrender.com
      # Cookies are same-origin (both frontend and API on il-app.onrender.com)
      # so COOKIE_DOMAIN is left unset (cookie defaults to the request host).
      - key: COOKIE_SECURE
        value: true
      - key: EMAIL_FROM
        value: India Learns <notifications@indialearns.app>
      - key: RECEIPT_ORG_NAME
        value: India Learns
      - key: WHATSAPP_ENABLED
        value: false
      - key: CERTIFIER_ENABLED
        value: false
      # Stub adapters for initial staging. Flip to cloudinary / brevo / live
      # once those credentials are available.
      - key: STORAGE_PROVIDER
        value: stub
      - key: EMAIL_PROVIDER
        value: stub
      - key: INTEGRATIONS_MODE
        value: stub
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      - fromGroup: il-app-secrets

  # -------- Cron jobs (5) --------
  # All cron jobs share the app's secret group (JOB_SECRET + API_ORIGIN).
  # Schedules are UTC.

  - type: cron
    name: il-cron-fee-reminders
    runtime: node
    region: singapore
    plan: starter
    schedule: "0 3 * * *" # 03:00 UTC = 08:30 IST daily
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs fee-reminders
    envVars:
      - fromGroup: il-app-secrets

  - type: cron
    name: il-cron-autosuspend
    runtime: node
    region: singapore
    plan: starter
    schedule: "0 22 * * *" # 22:00 UTC = 03:30 IST daily (TRD §10.1)
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs autosuspend
    envVars:
      - fromGroup: il-app-secrets

  - type: cron
    name: il-cron-sla-timers
    runtime: node
    region: singapore
    plan: starter
    schedule: "*/15 * * * *" # every 15 min
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs sla-timers
    envVars:
      - fromGroup: il-app-secrets

  - type: cron
    name: il-cron-faculty-digest
    runtime: node
    region: singapore
    plan: starter
    schedule: "30 3 * * 1" # Mon 03:30 UTC = 09:00 IST (D-063)
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs digest-faculty-weekly
    envVars:
      - fromGroup: il-app-secrets

  - type: cron
    name: il-cron-notifications-retry
    runtime: node
    region: singapore
    plan: starter
    schedule: "*/15 * * * *" # every 15 min (Q-M8-03)
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs notifications-retry
    envVars:
      - fromGroup: il-app-secrets

  # Admissions M3b — daily referee reminder (7-day nudge) + token expiry sweep.
  - type: cron
    name: il-cron-admissions-referee-reminders
    runtime: node
    region: singapore
    plan: starter
    schedule: "15 4 * * *" # 04:15 UTC = 09:45 IST daily
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs admissions-referee-reminders
    envVars:
      - fromGroup: il-app-secrets

  # Admissions M9 — daily audit chain head-hash snapshot (D-A4).
  - type: cron
    name: il-cron-admissions-audit-head-snapshot
    runtime: node
    region: singapore
    plan: starter
    schedule: "0 1 * * *" # 01:00 UTC = 06:30 IST daily
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs admissions-audit-head-snapshot
    envVars:
      - fromGroup: il-app-secrets

  # Admissions M9 — daily orphan-draft cleanup (storage GC + draft drop).
  - type: cron
    name: il-cron-admissions-draft-cleanup
    runtime: node
    region: singapore
    plan: starter
    schedule: "30 1 * * *" # 01:30 UTC = 07:00 IST daily
    buildCommand: ":"
    startCommand: node scripts/sign-job-jwt.mjs admissions-draft-cleanup
    envVars:
      - fromGroup: il-app-secrets

# ---- Secret group (single) ----
envVarGroups:
  - name: il-app-secrets
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JOB_SECRET
        sync: false
      - key: API_ORIGIN
        value: https://il-app.onrender.com
      # Email (set whichever provider you use; SendGrid is implicit fallback)
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Cloudinary (for live mode — leave unset while STORAGE_PROVIDER=stub)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional integrations (feature-flagged off at launch)
      - key: META_WABA_PHONE_ID
        sync: false
      - key: META_WABA_ACCESS_TOKEN
        sync: false
      - key: CERTIFIER_API_KEY
        sync: false
      - key: CERTIFIER_DEFAULT_TEMPLATE_ID
        sync: false
      # Receipts (Q-PENDING-02)
      - key: RECEIPT_ORG_ADDRESS
        sync: false
      - key: RECEIPT_ORG_GSTIN
        sync: false
      # Sentry (server + web share the same DSN in single-service mode)
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
